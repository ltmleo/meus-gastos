name: Release

# Push a tag like v1.0.0 to build the executables and publish them on the Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MeusGastos-windows.exe
          - os: macos-15
            asset: MeusGastos-macos-arm64.zip
          - os: macos-15-intel
            asset: MeusGastos-macos-x64.zip
          - os: ubuntu-22.04  # older glibc: the binary also runs on older distributions
            asset: MeusGastos-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tag confere com a versão do código
        shell: bash
        run: |
          CODE=$(python -c "import finance.__version__ as v; print(v.__version__)")
          test "${GITHUB_REF_NAME}" = "v${CODE}" || { echo "Tag ${GITHUB_REF_NAME} diferente da versão v${CODE} em finance/__version__.py"; exit 1; }
      - name: Dependências de build (versões fixas)
        run: python -m pip install -r requirements-build.txt
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Executável
        run: pyinstaller meusgastos.spec --noconfirm --clean
      - name: Empacotar
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/MeusGastos.exe "out/${{ matrix.asset }}"; BIN="out/${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --keepParent dist/MeusGastos.app "out/${{ matrix.asset }}"; BIN="dist/MeusGastos.app/Contents/MacOS/MeusGastos" ;;
            Linux)   cp dist/MeusGastos "out/${{ matrix.asset }}"; chmod +x "out/${{ matrix.asset }}"; BIN="out/${{ matrix.asset }}" ;;
          esac
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Teste de fumaça do executável
        shell: bash
        run: |
          DATA="$RUNNER_TEMP/meusgastos-smoke"
          "$BIN" --version
          "$BIN" --no-browser --port 8799 --db "$DATA/financas.sqlite3" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/api/security/status -o "$RUNNER_TEMP/status.json"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/status.json"
          grep -q '"app": "meusgastos"' "$RUNNER_TEMP/status.json"
          curl -fsS http://127.0.0.1:8799/ | grep -q '/js/main.js'
          curl -fsS -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8799/api/shutdown
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Meus Gastos ${{ github.ref_name }}" --generate-notes
